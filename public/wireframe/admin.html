<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WF — Admin Dashboard</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#e5e5e5;color:#111;margin:0;padding:24px}.page{max-width:1100px;margin:0 auto;background:#fff;border:2px solid #111;border-radius:8px;padding:20px}.wf{border:2px dashed #666;border-radius:6px;background:#f4f4f4;padding:12px;margin:10px 0;position:relative}.wf>.tag{position:absolute;top:-11px;left:10px;background:#111;color:#fff;font-size:10px;font-weight:bold;padding:2px 8px;border-radius:4px;letter-spacing:.05em}.row{display:flex;gap:10px;flex-wrap:wrap}.col{flex:1;min-width:150px}.box{border:2px solid #999;border-radius:6px;background:#fafafa;padding:10px;text-align:center;font-size:12px}.bar{height:14px;border-radius:7px;background:linear-gradient(90deg,#555 var(--w,60%),#ddd var(--w,60%))}.btn{display:inline-block;border:2px solid #111;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:bold;background:#fff}.btn.pri{background:#111;color:#fff}input,select,textarea{border:2px solid #999;border-radius:6px;padding:8px;width:100%;font-size:12px;background:#fff}h1{font-size:22px;margin:0 0 4px}p.sub{color:#444;font-size:13px;margin:0 0 6px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #999;padding:6px 8px;text-align:left}.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.back{color:#555;font-size:12px;margin-bottom:8px;display:inline-block}.note{background:#ffffcc;border:1px solid #999;border-radius:6px;padding:8px 10px;font-size:11px;margin:10px 0}a{color:#111}.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.hub a{display:block;border:2px solid #111;border-radius:8px;padding:14px;background:#fff;text-decoration:none}.hub a b{display:block;font-size:14px}.hub a span{font-size:11px;color:#444}</style></head><body><div class="page"><a class="back" href="index.html">← Indeks wireframe</a><h1>Admin Dashboard</h1><p class="sub">Route: <code>/admin (role admin)</code></p><div class="wf"><span class="tag">ADMIN NAV</span><p class="sub">🛡 Admin · 📦 Produk · 🏠 Homepage (+ menu profil)</p></div><div class="wf"><span class="tag">STATISTIK</span><div class="row"><div class="col box">Pengguna<br><b>N</b></div><div class="col box">Token<br><b>N</b></div><div class="col box">Compare<br><b>N</b></div><div class="col box">Order<br><b>N</b></div><div class="col box">Revenue<br><b>Rp</b></div></div></div><div class="wf"><span class="tag">PENGGUNA + SEARCH</span><input placeholder="Cari nama/email..."><table><tr><th>User</th><th>Role</th><th>Saldo</th><th>Token(±)</th></tr></table></div><div class="wf"><span class="tag">COMPARE TERBARU + ORDER TERBARU</span><table><tr><td>...</td></tr></table></div><p style="margin-top:16px"><a class="back" href="index.html">← Indeks wireframe</a></p></div></body></html>
